[package]
name = "crystal-loader"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "32-bit FFXI game host using the installed PlayOnline core for retail authentication and sessions"

[features]
# The default build steps polcore at the Viewer's 20 ms frame (pol-spec 07b decision 2).
default = []

# Own workspace root: this crate never joins the launcher build.
[workspace]

[lib]
name = "crystal_loader"
path = "src/lib.rs"

[[bin]]
name = "pol"
path = "src/main.rs"

# Credential-free probe of private Windower startup against an installed Hook.
[[bin]]
name = "windower-bootstrap-probe"
path = "src/bin/windower-bootstrap-probe.rs"

[dependencies]
roxmltree = "=0.20.0"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "zeroize_derive"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # BCryptHash: names the FFXIDB settings mutex by path (windower_plugin_settings.rs).
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    # Process-only thread lists for Windower Hook startup (windower_threads.rs).
    "Win32_System_Diagnostics_ProcessSnapshotting",
    "Win32_System_Kernel",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    # SetThreadExecutionState around the game, as stock pol.exe (awake.rs).
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # Scoped game-window verification and optional login-menu input.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Controller discovery: Raw Input device fingerprint (controller_record.rs).
    "Win32_UI_Input",
] }

[build-dependencies]
# Version information and icon resources (build.rs); build-time only.
embed-resource = "=3.0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
