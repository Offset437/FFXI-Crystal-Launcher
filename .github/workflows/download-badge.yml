# Counts real downloads of Crystal (installer + portable zip, every release) for the README
# badge. Update checks (launcher-update.json) and checksum files are not counted.
# The count is written to downloads.json on the `badges` branch, never to main.
name: Download badge

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: true

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count installer and zip downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          total=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '.[] | select(.draft | not) | .assets[] | select((.name | endswith("-Setup.exe")) or (.name | endswith(".zip"))) | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          if [ "$total" -ge 1000000 ]; then
            shown=$(awk -v n="$total" 'BEGIN { printf "%.1fM", n / 1000000 }')
          elif [ "$total" -ge 1000 ]; then
            shown=$(awk -v n="$total" 'BEGIN { printf "%.1fk", n / 1000 }')
          else
            shown="$total"
          fi
          shown=${shown/.0k/k}
          shown=${shown/.0M/M}
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"blue"}\n' "$shown" > downloads.json
          echo "Counted $total downloads ($shown)"

      - name: Publish to the badges branch
        run: |
          set -euo pipefail
          git init -q badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin badges; then git checkout -q -b badges FETCH_HEAD; else git checkout -q --orphan badges; fi
          cp ../downloads.json downloads.json
          git add downloads.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -q -m "Download count"
          git push -q origin badges
